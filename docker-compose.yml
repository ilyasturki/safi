services:
    safi:
        image: ghcr.io/ilyasturki/safi:latest
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            # Match these to your host user (run `id` to find them).
            # Files created under ./vaults will be owned by this user.
            - PUID=1000
            - PGID=1000
            # Server configuration
            - HOST=0.0.0.0
            - PORT=3000
        volumes:
            # Each top-level subfolder of ./vaults is auto-discovered as a
            # separate vault. `.obsidian/` directories inside vaults are
            # preserved untouched for Obsidian compatibility.
            - ./vaults:/app/vaults
            # Global preferences and keybindings (shared across all vaults).
            - ./config:/app/config
