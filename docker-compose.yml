services:
    safi:
        image: ghcr.io/ilyasturki/safi:latest
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            # Match these to your host user (run `id` to find them).
            # Files created under ./vaults will be owned by this user.
            - PUID=1000
            - PGID=1000
            # Server configuration
            - HOST=0.0.0.0
            - PORT=3000
        volumes:
            # A place to keep your vault folders. Register them from the app by
            # browsing to /app/vaults. `.obsidian/` directories inside vaults are
            # preserved untouched for Obsidian compatibility.
            - ./vaults:/app/vaults
            # Vault list (vaults.json), preferences, and keybindings.
            - ./config:/app/config
